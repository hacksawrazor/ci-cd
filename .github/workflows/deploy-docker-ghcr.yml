name: Reusable Dynamic Docker Deploy to EC2

on:
  workflow_call:
    inputs:
      aws-region:
        required: false
        type: string
        default: 'ap-south-1'
      aws-role-to-assume:
        required: true
        type: string
      image-name:
        description: 'Image name (e.g. org/my-api)'
        required: true
        type: string
      deploy-path:
        description: 'Target path on EC2 server'
        required: true
        type: string
      container-port:
        description: 'Fallback port mapping if no docker-compose.yml exists'
        required: false
        type: string
        default: '8000:8000'
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true
      # Key-value JSON containing individually mapped secrets
      INDIVIDUAL_SECRETS_JSON:
        required: false

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
          FULL_IMAGE: ghcr.io/${{ inputs.image-name }}
        run: |
          docker build -t $FULL_IMAGE:$IMAGE_TAG -t $FULL_IMAGE:latest .
          docker push $FULL_IMAGE:$IMAGE_TAG
          docker push $FULL_IMAGE:latest

      - name: Process Docker Compose Strategy
        env:
          FULL_IMAGE: ghcr.io/${{ inputs.image-name }}
          PORT_MAPPING: ${{ inputs.container-port }}
        run: |
          if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
            echo "Custom docker-compose file detected. Using repository configuration."
          else
            echo "No docker-compose file found. Generating default docker-compose.yml..."
            cat << EOF > docker-compose.yml
          version: '3.8'
          services:
            app:
              image: ${FULL_IMAGE}:latest
              restart: unless-stopped
              ports:
                - "${PORT_MAPPING}"
              env_file:
                - .env
          EOF
          fi

      - name: Generate .env from Schema and Individual Secrets
        env:
          SECRETS_JSON: ${{ secrets.INDIVIDUAL_SECRETS_JSON }}
        run: |
          > .env

          # Convert incoming JSON secrets into an associative map
          if [ -n "$SECRETS_JSON" ] && [ "$SECRETS_JSON" != "{}" ]; then
            eval "$(echo "$SECRETS_JSON" | jq -r 'to_entries[] | "SECRET_\(.key)=\(@sh \(.value))"')"
          fi

          if [ -f ".env.example" ]; then
            echo "Processing .env.example schema..."
            while IFS= read -r line || [ -n "$line" ]; do
              # Preserve comments and blank lines
              if [[ -z "$line" || "$line" =~ ^# ]]; then
                echo "$line" >> .env
                continue
              fi

              KEY=$(echo "$line" | cut -d '=' -f 1 | xargs)
              DEFAULT_VAL=$(echo "$line" | cut -d '=' -f 2-)

              # Check if a matching individual secret variable exists
              VAR_NAME="SECRET_${KEY}"
              SECRET_VAL="${!VAR_NAME}"

              if [ -n "$SECRET_VAL" ]; then
                echo "${KEY}=${SECRET_VAL}" >> .env
              else
                echo "${KEY}=${DEFAULT_VAL}" >> .env
              fi
            done < .env.example
          else
            echo "No .env.example found. Dumping non-empty secrets directly to .env..."
            if [ -n "$SECRETS_JSON" ] && [ "$SECRETS_JSON" != "{}" ]; then
              echo "$SECRETS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> .env
            fi
          fi

      - name: Copy Compose and .env Files to EC2 Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,docker-compose.yaml,.env"
          target: ${{ inputs.deploy-path }}

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Deploy Container via Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          FULL_IMAGE: ghcr.io/${{ inputs.image-name }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: FULL_IMAGE,IMAGE_TAG,DEPLOY_PATH,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            cd $DEPLOY_PATH

            # Login to GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            export FULL_IMAGE=$FULL_IMAGE
            export IMAGE_TAG=$IMAGE_TAG

            # Pull image and restart service
            docker compose pull
            docker compose up -d --remove-orphans

            # Clean up .env on server and prune unused images
            rm -f .env
            docker image prune -f