name: Reusable Dynamic Docker Deploy to EC2

on:
  workflow_call:
    inputs:
      aws-region:
        required: false
        type: string
        default: 'ap-south-1'
      aws-role-to-assume:
        required: true
        type: string
      image-name:
        description: 'Image name (e.g. org/my-api)'
        required: true
        type: string
      deploy-path:
        description: 'Target path on EC2 server'
        required: true
        type: string
      container-port:
        description: 'Fallback port mapping if no docker-compose.yml exists'
        required: false
        type: string
        default: '8000:8000'
      use-sudo:
        description: 'Use passwordless sudo to prepare bind-mount paths under privileged directories'
        required: false
        type: boolean
        default: false
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true
      # Key-value JSON containing individually mapped secrets
      INDIVIDUAL_SECRETS_JSON:
        required: false

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Push Docker Image
        uses: hacksawrazor/ci-cd/.github/actions/build-docker-image@main
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ inputs.image-name }}
          image-tag: ${{ github.sha }}

      - name: Prepare Docker Deployment
        uses: hacksawrazor/ci-cd/.github/actions/prepare-docker-deployment@main
        with:
          full-image: ghcr.io/${{ inputs.image-name }}
          container-port: ${{ inputs.container-port }}
          secrets-json: ${{ secrets.INDIVIDUAL_SECRETS_JSON || '{}' }}

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Deploy Container via Docker Compose on EC2
        uses: hacksawrazor/ci-cd/.github/actions/deploy-docker-compose@main
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          deploy-path: ${{ inputs.deploy-path }}
          use-sudo: ${{ inputs.use-sudo }}
          full-image: ghcr.io/${{ inputs.image-name }}
          image-tag: ${{ github.sha }}
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}