name: Sync SSL Certificates from OCI to EC2

on:
  workflow_dispatch:
    inputs:
      reload-nginx:
        description: Reload the Nginx container after the certificate sync
        required: false
        type: boolean
        default: true
      source-server:
        description: Source server
        required: true
        type: choice
        options: [oci, ec2, oci-1c]
        default: oci
      dest-server:
        description: Destination server
        required: true
        type: choice
        options: [oci, ec2, oci-1c]
        default: ec2

permissions:
  contents: read

concurrency:
  group: ssl-certificates-oci-ec2
  cancel-in-progress: false

jobs:
  sync-certificates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure OCI SSH
        id: oci-ssh
        uses: ./.github/actions/configure-ssh
        with:
          host: ${{ secrets.SERVER_HOST_OCI }}
          key: ${{ secrets.SERVER_SSH_KEY_OCI }}
          port: ${{ secrets.SERVER_SSH_PORT_OCI || '22' }}
          directory-name: oci-ssh

      - name: Configure EC2 SSH
        id: ec2-ssh
        uses: ./.github/actions/configure-ssh
        with:
          host: ${{ secrets.SERVER_HOST_EC2 }}
          key: ${{ secrets.SERVER_SSH_KEY_EC2 }}
          port: ${{ secrets.SERVER_SSH_PORT_EC2 || '22' }}
          directory-name: ec2-ssh

      - name: Configure oci-1c SSH
        id: oci-1c-ssh
        uses: ./.github/actions/configure-ssh
        with:
          host: ${{ secrets.SERVER_HOST_OCI_1C }}
          key: ${{ secrets.SERVER_SSH_KEY_OCI_1C }}
          port: ${{ secrets.SERVER_SSH_PORT_OCI_1C || '22' }}
          directory-name: oci-1c-ssh

      - name: Stream certificates from OCI to EC2
        shell: bash
        env:
          OCI_SSH_DIR: ${{ steps.oci-ssh.outputs.ssh-dir }}
          OCI_HOST: ${{ secrets.SERVER_HOST_OCI }}
          OCI_USER: ${{ secrets.SERVER_USER_OCI }}
          OCI_PORT: ${{ secrets.SERVER_SSH_PORT_OCI || '22' }}
          EC2_SSH_DIR: ${{ steps.ec2-ssh.outputs.ssh-dir }}
          EC2_HOST: ${{ secrets.SERVER_HOST_EC2 }}
          EC2_USER: ${{ secrets.SERVER_USER_EC2 }}
          EC2_PORT: ${{ secrets.SERVER_SSH_PORT_EC2 || '22' }}
          O1C_SSH_DIR: ${{ steps.oci-1c-ssh.outputs.ssh-dir }}
          O1C_HOST: ${{ secrets.SERVER_HOST_OCI_1C }}
          O1C_USER: ${{ secrets.SERVER_USER_OCI_1C }}
          O1C_PORT: ${{ secrets.SERVER_SSH_PORT_OCI_1C || '22' }}
          SOURCE_SERVER: ${{ inputs.source-server }}
          DEST_SERVER: ${{ inputs.dest-server }}
        run: |
          set -Eeuo pipefail

          oci_ssh_args=( -i "$OCI_SSH_DIR/id_ed25519" -p "$OCI_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$OCI_SSH_DIR/known_hosts" )
          ec2_ssh_args=( -i "$EC2_SSH_DIR/id_ed25519" -p "$EC2_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$EC2_SSH_DIR/known_hosts" )
          oci1c_ssh_args=( -i "$O1C_SSH_DIR/id_ed25519" -p "$O1C_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$O1C_SSH_DIR/known_hosts" )
          declare -A ARG_MAP=( ["oci"]="oci_ssh_args" ["ec2"]="ec2_ssh_args" ["oci-1c"]="oci1c_ssh_args" )
          src_args_name="${ARG_MAP[$SOURCE_SERVER]}"
          dst_args_name="${ARG_MAP[$DEST_SERVER]}"
          case "$SOURCE_SERVER" in
            oci) src_host="$OCI_HOST"; src_user="$OCI_USER" ;;
            ec2) src_host="$EC2_HOST"; src_user="$EC2_USER" ;;
            oci-1c) src_host="$O1C_HOST"; src_user="$O1C_USER" ;;
          esac
          case "$DEST_SERVER" in
            oci) dst_host="$OCI_HOST"; dst_user="$OCI_USER" ;;
            ec2) dst_host="$EC2_HOST"; dst_user="$EC2_USER" ;;
            oci-1c) dst_host="$O1C_HOST"; dst_user="$O1C_USER" ;;
          esac
          ssh "${!src_args_name[@]}" "$src_user@$src_host" 'sudo -n tar --create --gzip --file=- --directory=/ etc/letsencrypt' | ssh "${!dst_args_name[@]}" "$dst_user@$dst_host" 'sudo -n tar --extract --gzip --file=- --directory=/'

      - name: Reload Nginx on ${{ inputs.dest-server }}
        if: ${{ inputs.reload-nginx }}
        shell: bash
        env:
          SSH_DIR: ${{ steps.ec2-ssh.outputs.ssh-dir }}
          SERVER_HOST: ${{ secrets.SERVER_HOST_EC2 }}
          SERVER_USER: ${{ secrets.SERVER_USER_EC2 }}
          SERVER_PORT: ${{ secrets.SERVER_SSH_PORT_EC2 || '22' }}
        run: |
          set -Eeuo pipefail
          ssh_args=( -i "$SSH_DIR/id_ed25519" -p "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" )
          ssh "${ssh_args[@]}" "$SERVER_USER@$SERVER_HOST" 'sudo -n docker exec nginx nginx -t && sudo -n docker exec nginx nginx -s reload'
