name: Reusable Deployment Change Classifier

on:
  workflow_call:
    inputs:
      config-paths:
        description: Newline-separated glob patterns for configuration-only files
        required: true
        type: string
      force-full-deploy:
        description: Mark the change as requiring a full deployment
        required: false
        type: boolean
        default: false
    outputs:
      config_only:
        description: All changed files matched a configuration-only pattern
        value: ${{ jobs.classify.outputs.config_only }}
      full_deploy:
        description: At least one changed file matched a full-deploy pattern
        value: ${{ jobs.classify.outputs.full_deploy }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      config_only: ${{ steps.classify.outputs.config_only }}
      full_deploy: ${{ steps.classify.outputs.full_deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changes
        id: classify
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          CONFIG_PATHS: ${{ inputs.config-paths }}
          FORCE_FULL_DEPLOY: ${{ inputs.force-full-deploy }}
        run: |
          set -Eeuo pipefail

          if [ "$FORCE_FULL_DEPLOY" = 'true' ]; then
            echo 'config_only=false' >> "$GITHUB_OUTPUT"
            echo 'full_deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BEFORE" = '0000000000000000000000000000000000000000' ]; then
            mapfile -t changed_files < <(git ls-tree -r --name-only "$SHA")
          else
            mapfile -t changed_files < <(git diff --name-only "$BEFORE" "$SHA")
          fi
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo 'config_only=false' >> "$GITHUB_OUTPUT"
            echo 'full_deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          config_only=true
          full_deploy=false
          while IFS= read -r changed_file; do
            [ -z "$changed_file" ] && continue
            is_config=false
            while IFS= read -r pattern; do
              [ -z "$pattern" ] && continue
              if [[ "$changed_file" == $pattern ]]; then
                is_config=true
                break
              fi
            done <<< "$CONFIG_PATHS"
            if [ "$is_config" = true ]; then
              continue
            fi

            config_only=false
            full_deploy=true
          done < <(printf '%s\n' "${changed_files[@]}")

          if [ "$config_only" = true ]; then
            full_deploy=false
          fi
          if [ "$full_deploy" = false ]; then
            config_only=false
          fi

          echo "config_only=$config_only" >> "$GITHUB_OUTPUT"
          echo "full_deploy=$full_deploy" >> "$GITHUB_OUTPUT"