name: Deploy Docker Compose
description: Copy Compose configuration and deploy it to a remote Docker host.
inputs:
  host:
    description: Remote SSH host
    required: true
  user:
    description: Remote SSH user
    required: true
  key:
    description: SSH private key
    required: true
  port:
    description: Remote SSH port
    required: false
    default: '22'
  deploy-path:
    description: Remote deployment directory
    required: true
  use-sudo:
    description: Use passwordless sudo to prepare the remote directory
    required: false
    default: 'false'
  full-image:
    description: Fully qualified image name
    required: true
  image-tag:
    description: Immutable image tag
    required: true
  registry:
    description: Container registry hostname
    required: false
    default: ghcr.io
  registry-username:
    description: Container registry username
    required: true
  registry-token:
    description: Container registry token
    required: true
runs:
  using: composite
  steps:
    - name: Prepare remote deployment directory
      uses: appleboy/ssh-action@v1.0.3
      env:
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        DEPLOY_USER: ${{ inputs.user }}
        USE_SUDO: ${{ inputs.use-sudo }}
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.user }}
        key: ${{ inputs.key }}
        port: ${{ inputs.port }}
        envs: DEPLOY_PATH,DEPLOY_USER,USE_SUDO
        script: |
          if [ "$USE_SUDO" = "true" ]; then
            sudo -n mkdir -p "$DEPLOY_PATH"
            sudo -n chown -R "$DEPLOY_USER:$DEPLOY_USER" "$DEPLOY_PATH"
          else
            mkdir -p "$DEPLOY_PATH"
          fi

          test -w "$DEPLOY_PATH"

    - name: Copy Compose and environment files
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.user }}
        key: ${{ inputs.key }}
        port: ${{ inputs.port }}
        source: docker-compose.yml,.env
        target: ${{ inputs.deploy-path }}

    - name: Persist Compose runtime variables
      uses: appleboy/ssh-action@v1.0.3
      env:
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        FULL_IMAGE: ${{ inputs.full-image }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.user }}
        key: ${{ inputs.key }}
        port: ${{ inputs.port }}
        envs: DEPLOY_PATH,FULL_IMAGE,IMAGE_TAG
        script: |
          cd "$DEPLOY_PATH"
          {
            printf '\n# Docker Compose deployment variables\n'
            printf 'FULL_IMAGE=%s\n' "$FULL_IMAGE"
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
          } >> .env

    - name: Prepare Compose volume permissions
      uses: appleboy/ssh-action@v1.0.3
      env:
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        USE_SUDO: ${{ inputs.use-sudo }}
        FULL_IMAGE: ${{ inputs.full-image }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.user }}
        key: ${{ inputs.key }}
        port: ${{ inputs.port }}
        envs: DEPLOY_PATH,USE_SUDO,FULL_IMAGE,IMAGE_TAG
        script: |
          set -Eeuo pipefail
          cd "$DEPLOY_PATH"

          if [ "$USE_SUDO" = "true" ]; then
            volume_mounts=$(sudo -n docker compose config --format json | jq -r '
              .services // {} |
              to_entries[] |
              .key as $service |
              (.value.user // "") as $user |
              (.value.volumes // [])[] |
              select(.type == "bind") |
              [$service, $user, .source] |
              @tsv
            ')
          else
            volume_mounts=$(docker compose config --format json | jq -r '
              .services // {} |
              to_entries[] |
              .key as $service |
              (.value.user // "") as $user |
              (.value.volumes // [])[] |
              select(.type == "bind") |
              [$service, $user, .source] |
              @tsv
            ')
          fi

          while IFS=$'\t' read -r service container_user host_path; do
            [ -n "$host_path" ] || continue

            if [ "$USE_SUDO" = "true" ]; then
              sudo -n mkdir -p "$host_path"
            else
              mkdir -p "$host_path"
            fi

            if [[ "$container_user" =~ ^[0-9]+(:[0-9]+)?$ ]]; then
              owner="$container_user"
              case "$owner" in
                *:*) ;;
                *) owner="$owner:$owner" ;;
              esac

              if [ "$USE_SUDO" = "true" ]; then
                sudo -n chown -R "$owner" "$host_path"
                sudo -n chmod -R u+rwX,go+rX "$host_path"
              else
                chown -R "$owner" "$host_path"
                chmod -R u+rwX,go+rX "$host_path"
              fi
            fi
          done <<< "$volume_mounts"

    - name: Deploy with Docker Compose
      uses: appleboy/ssh-action@v1.0.3
      env:
        FULL_IMAGE: ${{ inputs.full-image }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        REGISTRY: ${{ inputs.registry }}
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        USE_SUDO: ${{ inputs.use-sudo }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.user }}
        key: ${{ inputs.key }}
        port: ${{ inputs.port }}
        envs: FULL_IMAGE,IMAGE_TAG,REGISTRY,DEPLOY_PATH,USE_SUDO,REGISTRY_USERNAME,REGISTRY_TOKEN
        script: |
          cd "$DEPLOY_PATH"

          if [ "$USE_SUDO" = "true" ]; then
            echo "$REGISTRY_TOKEN" | sudo -n docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
            sudo -n env FULL_IMAGE="$FULL_IMAGE" IMAGE_TAG="$IMAGE_TAG" docker compose pull
            sudo -n env FULL_IMAGE="$FULL_IMAGE" IMAGE_TAG="$IMAGE_TAG" docker compose up -d --remove-orphans
            image_ids=$(sudo -n docker ps -aq | xargs -r sudo -n docker inspect --format '{{.Image}}' | sed 's/^sha256://' | cut -c1-12 | sort -u)
            sudo -n docker image ls "$FULL_IMAGE" --format '{{.ID}}' | sort -u | while read -r image_id; do
              normalized_image_id=$(sed 's/^sha256://' <<< "$image_id" | cut -c1-12)
              if ! grep -Fxq "$normalized_image_id" <<< "$image_ids"; then
                sudo -n docker image rm "$image_id" || true
              fi
            done
            sudo -n docker image prune -f
          else
            echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
            export FULL_IMAGE IMAGE_TAG
            docker compose pull
            docker compose up -d --remove-orphans
            image_ids=$(docker ps -aq | xargs -r docker inspect --format '{{.Image}}' | sed 's/^sha256://' | cut -c1-12 | sort -u)
            docker image ls "$FULL_IMAGE" --format '{{.ID}}' | sort -u | while read -r image_id; do
              normalized_image_id=$(sed 's/^sha256://' <<< "$image_id" | cut -c1-12)
              if ! grep -Fxq "$normalized_image_id" <<< "$image_ids"; then
                docker image rm "$image_id" || true
              fi
            done
            docker image prune -f
          fi