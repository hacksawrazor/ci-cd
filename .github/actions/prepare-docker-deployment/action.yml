name: Prepare Docker Deployment
description: Prepare Compose configuration and generate an environment file.
inputs:
  full-image:
    description: Fully qualified image name
    required: true
  container-port:
    description: Fallback port mapping
    required: false
    default: 8000:8000
  secrets-json:
    description: JSON object containing deployment secrets
    required: false
    default: '{}'
runs:
  using: composite
  steps:
    - name: Process Docker Compose strategy
      shell: bash
      env:
        FULL_IMAGE: ${{ inputs.full-image }}
        PORT_MAPPING: ${{ inputs.container-port }}
      run: |
        if [ -f "docker-compose.yaml" ] && [ ! -f "docker-compose.yml" ]; then
          cp docker-compose.yaml docker-compose.yml
        fi

        if [ -f "docker-compose.yml" ]; then
          echo "Custom docker-compose file detected. Using repository configuration."
        else
          echo "No docker-compose file found. Generating default docker-compose.yml..."
          cat << EOF > docker-compose.yml
        services:
          app:
            image: ${FULL_IMAGE}:\${IMAGE_TAG:-latest}
            restart: unless-stopped
            ports:
              - "${PORT_MAPPING}"
            env_file:
              - .env
        EOF
        fi

    - name: Generate environment file
      shell: bash
      env:
        SECRETS_JSON: ${{ inputs.secrets-json }}
      run: |
        > .env

        escape_env_value() {
          local value="$1"
          value=${value//$'\r'/}
          value=${value//$'\n'/\\n}
          printf '%s' "$value"
        }

        if [ -f ".env.example" ]; then
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ -z "$line" || "$line" =~ ^# ]]; then
              echo "$line" >> .env
              continue
            fi

            KEY=$(echo "$line" | cut -d '=' -f 1 | xargs)
            DEFAULT_VAL=$(echo "$line" | cut -d '=' -f 2-)

            if jq -e --arg key "$KEY" 'has($key) and .[$key] != null' <<< "$SECRETS_JSON" >/dev/null 2>&1; then
              jq_value=$(jq -r --arg key "$KEY" '.[$key]' <<< "$SECRETS_JSON")
              printf '%s=%s\n' "$KEY" "$(escape_env_value "$jq_value")" >> .env
            else
              printf '%s=%s\n' "$KEY" "$DEFAULT_VAL" >> .env
            fi
          done < .env.example
        elif [ -n "$SECRETS_JSON" ] && [ "$SECRETS_JSON" != "{}" ]; then
          while IFS= read -r encoded_entry; do
            entry=$(printf '%s' "$encoded_entry" | base64 --decode)
            key=$(jq -r '.key' <<< "$entry")
            value=$(jq -r '.value' <<< "$entry")
            printf '%s=%s\n' "$key" "$(escape_env_value "$value")" >> .env
          done < <(jq -r 'to_entries[] | @base64' <<< "$SECRETS_JSON")
        fi