name: Sync Docker Project
description: Back up the remote project, synchronize repository files, and transfer the environment payload.
inputs:
  ssh-dir:
    description: Directory containing SSH files
    required: true
  host:
    description: Remote SSH host
    required: true
  user:
    description: Remote SSH user
    required: true
  port:
    description: Remote SSH port
    required: false
    default: '22'
  deploy-path:
    description: Remote deployment directory
    required: true
  use-sudo:
    description: Use passwordless sudo to prepare deployment paths under privileged directories
    required: false
    default: 'false'
  environment-file:
    description: Remote environment file
    required: true
  environment-vars-json:
    description: JSON object of non-secret variables to overlay on the defaults
    required: false
    default: '{}'
  release-id:
    description: Unique deployment identifier
    required: true
runs:
  using: composite
  steps:
    - name: Create environment payload
      shell: bash
      env:
        ENVIRONMENT_FILE: ${{ inputs.environment-file }}
        ENVIRONMENT_VARS_JSON: ${{ inputs.environment-vars-json }}
      run: |
        set -Eeuo pipefail
        payload_file="$RUNNER_TEMP/deploy-env"
        default_file="$ENVIRONMENT_FILE.default"
        if [ -f "$default_file" ]; then
            jq -e 'type == "object"' <<< "$ENVIRONMENT_VARS_JSON" >/dev/null
            defaults='{}'
            while IFS= read -r line || [ -n "$line" ]; do
              if [[ -z "$line" || "$line" =~ ^[[:space:]]*# || "$line" != *=* ]]; then
                continue
              fi
              key="${line%%=*}"
              key="${key#${key%%[![:space:]]*}}"
              key="${key%${key##*[![:space:]]}}"
              value="${line#*=}"
              defaults=$(jq -c --arg key "$key" --arg value "$value" '. + {($key): $value}' <<< "$defaults")
            done < "$default_file"

            merged=$(jq -c --argjson vars "$ENVIRONMENT_VARS_JSON" \
              '. as $defaults | $defaults * ($vars | with_entries(select(.key as $key | $defaults | has($key))))' \
              <<< "$defaults")
            : > "$payload_file"
            while IFS= read -r encoded_entry; do
              entry=$(printf '%s' "$encoded_entry" | base64 --decode)
              key=$(jq -r '.key' <<< "$entry")
              value=$(jq -r '.value | tostring' <<< "$entry")
              value=${value//$'\r'/}
              value=${value//$'\n'/\\n}
              printf '%s=%s\n' "$key" "$value" >> "$payload_file"
            done < <(jq -r 'to_entries[] | @base64' <<< "$merged")
        fi

        if [ -f "$payload_file" ]; then
          base64 -w 0 "$payload_file" > "$RUNNER_TEMP/deploy-env.b64"
        else
          : > "$RUNNER_TEMP/deploy-env.b64"
        fi

    - name: Back up remote project
      shell: bash
      env:
        SSH_DIR: ${{ inputs.ssh-dir }}
        SERVER_HOST: ${{ inputs.host }}
        SERVER_USER: ${{ inputs.user }}
        SERVER_SSH_PORT: ${{ inputs.port }}
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        USE_SUDO: ${{ inputs.use-sudo }}
        RELEASE_ID: ${{ inputs.release-id }}
      run: |
        set -Eeuo pipefail
        ssh_args=(-i "$SSH_DIR/id_ed25519" -p "$SERVER_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts")
        remote="$SERVER_USER@$SERVER_HOST"
        ssh "${ssh_args[@]}" "$remote" env DEPLOY_PATH="$DEPLOY_PATH" DEPLOY_USER="$SERVER_USER" USE_SUDO="$USE_SUDO" RELEASE_ID="$RELEASE_ID" 'bash -s' <<'REMOTE'
        set -Eeuo pipefail
        if [ "$USE_SUDO" = "true" ]; then
          sudo -n mkdir -p "$DEPLOY_PATH"
          sudo -n chown -R "$DEPLOY_USER:$DEPLOY_USER" "$DEPLOY_PATH"
        else
          mkdir -p "$DEPLOY_PATH"
        fi
        mkdir -p "$DEPLOY_PATH/.deploy-backups"
        if [ "$(find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 ! -name .deploy-backups -print -quit 2>/dev/null)" ]; then
          tar --exclude=.deploy-backups -czf "$DEPLOY_PATH/.deploy-backups/$RELEASE_ID.tgz" -C "$DEPLOY_PATH" .
        fi
        mkdir -p "$DEPLOY_PATH"
        REMOTE

    - name: Synchronize repository files
      shell: bash
      env:
        SSH_DIR: ${{ inputs.ssh-dir }}
        SERVER_HOST: ${{ inputs.host }}
        SERVER_USER: ${{ inputs.user }}
        SERVER_SSH_PORT: ${{ inputs.port }}
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        ENVIRONMENT_FILE: ${{ inputs.environment-file }}
      run: |
        set -Eeuo pipefail
        ssh_args=(-i "$SSH_DIR/id_ed25519" -p "$SERVER_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts")
        rsync -az --delete \
          --exclude='.git/' \
          --exclude='.github/' \
          --exclude='.deploy-backups/' \
          --exclude="$ENVIRONMENT_FILE" \
          -e "ssh ${ssh_args[*]}" ./ "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"

    - name: Transfer environment payload
      shell: bash
      env:
        SSH_DIR: ${{ inputs.ssh-dir }}
        SERVER_HOST: ${{ inputs.host }}
        SERVER_USER: ${{ inputs.user }}
        SERVER_SSH_PORT: ${{ inputs.port }}
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        RELEASE_ID: ${{ inputs.release-id }}
      run: |
        set -Eeuo pipefail
        scp_args=(-i "$SSH_DIR/id_ed25519" -P "$SERVER_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts")
        scp "${scp_args[@]}" "$RUNNER_TEMP/deploy-env.b64" "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/.deploy-env-$RELEASE_ID"